# ===== Aplicacao =====
spring.application.name=crow-api
server.port=8080
spring.profiles.active=local

# Inclui a mensagem das excecoes (ResponseStatusException) no corpo de erro,
# permitindo que o frontend exiba mensagens especificas ao usuario.
server.error.include-message=always

# ===== PostgreSQL =====
spring.datasource.url=jdbc:postgresql://localhost:5432/crow_db
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# ===== JWT =====
# Em producao defina a variavel de ambiente JWT_SECRET; o valor abaixo e
# apenas um fallback para desenvolvimento local.
jwt.secret=${JWT_SECRET:crow-api-dev-secret-key-com-pelo-menos-256-bits-apenas-para-desenvolvimento-local}
jwt.expiration=86400000

# ===== Email (Gmail SMTP) =====
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ===== Uploads =====
app.upload-dir=uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ===== CORS =====
cors.allowed-origins=http://localhost:4200
