# ===== Produção (Render + Supabase + Cloudflare) =====
# Ativado por SPRING_PROFILES_ACTIVE=prod no Render. Tudo o que é sensível vem
# de variáveis de ambiente do serviço; nenhum segredo fica no repositório.
# Visão geral do ambiente: docs/deploy-producao.md

# O Render informa a porta em PORT
server.port=${PORT:8080}
# Plano gratuito: 512 MB de RAM
server.tomcat.threads.max=50

# ===== PostgreSQL (Supabase, pooler em modo sessão — conexão IPv4) =====
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5

# ===== Uploads (Supabase Storage) =====
# Bucket público; o Worker do Cloudflare serve /api/uploads/** direto dele.
app.supabase.url=${SUPABASE_URL}
app.supabase.chave=${SUPABASE_CHAVE}
app.supabase.bucket=uploads

# ===== E-mail =====
# O Render gratuito bloqueia as portas SMTP: a mensagem vai por HTTPS para o
# Worker do Cloudflare, que envia pelo Gmail (ver config/EmailRelaySender).
app.mail.relay.url=${EMAIL_RELAY_URL}
app.mail.relay.token=${EMAIL_RELAY_TOKEN}
app.mail.remetente=${MAIL_USERNAME}

# ===== Seed =====
# Banco novo recebe só o admin@crow.com, com a senha inicial do ambiente.
app.seed.admin-senha=${ADMIN_SENHA_INICIAL}
app.seed.usuario-teste=false

# ===== CORS =====
# O navegador fala com o Worker (mesma origem do site), que repassa o Origin.
cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
