<header class="topbar">
  <div class="icon left"></div>

  <div class="logo">
    <img routerLink="/home" src="../../../assets/imgs/logo-removebg.png" alt="Logo">
  </div>

  <div class="user-area">
    <span class="user-name">{{ nomeUsuario }}</span>
    
    <button class="user-btn" (click)="toggleMenu()" [class.active]="menuAberto">
      <div class="user-avatar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
          <circle cx="12" cy="7" r="4"></circle>
        </svg>
      </div>
    </button>

    <div class="dropdown" *ngIf="menuAberto">
      <button routerLink="/perfil" (click)="perfil()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
          <circle cx="12" cy="7" r="4"></circle>
        </svg>
        Perfil
      </button>
      
      <button routerLink="/login" (click)="logout()" class="logout">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
          <polyline points="16 17 21 12 16 7"></polyline>
          <line x1="21" y1="12" x2="9" y2="12"></line>
        </svg>
        Sair
      </button>
    </div>
  </div>
</header>
