<div class="player"
     [class.barra]="variante === 'barra'"
     [class.pequeno]="tamanho === 'pequeno'"
     [class.tocando]="ativo()"
     [class.com-erro]="estado() === 'erro'">

  <button type="button"
          class="btn-tocar"
          (click)="alternar($event)"
          [disabled]="!src"
          [attr.aria-label]="rotuloBotao()"
          [title]="rotuloBotao()">
    <!-- Carregando -->
    <svg *ngIf="estado() === 'carregando'" class="icone-carregando" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 12a9 9 0 1 1-6.219-8.56"/>
    </svg>
    <!-- Tocando: pausar -->
    <svg *ngIf="estado() === 'tocando'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="6" y="4" width="4" height="16"/>
      <rect x="14" y="4" width="4" height="16"/>
    </svg>
    <!-- Falhou: alto-falante cortado -->
    <svg *ngIf="estado() === 'erro'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
      <line x1="23" y1="9" x2="17" y2="15"/>
      <line x1="17" y1="9" x2="23" y2="15"/>
    </svg>
    <ng-container *ngIf="estado() === 'parado' || estado() === 'pausado'">
      <!-- Barra: play -->
      <svg *ngIf="variante === 'barra'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="6 3 20 12 6 21 6 3"/>
      </svg>
      <!-- Mini: alto-falante -->
      <svg *ngIf="variante === 'mini'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
        <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/>
      </svg>
    </ng-container>
  </button>

  <ng-container *ngIf="variante === 'barra'">
    <input type="range"
           class="progresso"
           min="0"
           [max]="duracao()"
           step="0.01"
           [value]="posicao()"
           [disabled]="!duracao()"
           (input)="buscar($event)"
           (click)="$event.stopPropagation()"
           [attr.aria-label]="'Posição em ' + rotulo"
           [attr.aria-valuetext]="tempoTexto()" />
    <span class="tempo">{{ tempoTexto() }}</span>
  </ng-container>

  <select *ngIf="velocidade"
          class="velocidade"
          (change)="mudarVelocidade($event)"
          (click)="$event.stopPropagation()"
          [attr.aria-label]="'Velocidade de ' + rotulo"
          title="Velocidade de reprodução">
    <option *ngFor="let valor of velocidades" [value]="valor" [selected]="valor === taxa()">
      {{ rotuloVelocidade(valor) }}
    </option>
  </select>
</div>
