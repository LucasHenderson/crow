<div class="anexo" *ngIf="audio; else semAudio">
  <app-player-audio
    [src]="audio"
    [rotulo]="'o áudio ' + rotulo"
    tamanho="pequeno"
  ></app-player-audio>
  <span class="anexo-texto">{{ duracaoTexto() }}</span>
  <button type="button"
          class="btn-remover"
          (click)="remover($event)"
          [attr.aria-label]="'Remover áudio ' + rotulo"
          title="Remover áudio">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <line x1="18" y1="6" x2="6" y2="18"/>
      <line x1="6" y1="6" x2="18" y2="18"/>
    </svg>
  </button>
</div>

<ng-template #semAudio>
  <button type="button"
          class="btn-anexar"
          (click)="escolher(seletor, $event)"
          [disabled]="verificando()"
          [attr.aria-label]="'Adicionar áudio ' + rotulo + ' (opcional)'"
          [title]="dica">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <line x1="12" y1="5" x2="12" y2="19"/>
      <line x1="5" y1="12" x2="19" y2="12"/>
    </svg>
    {{ verificando() ? 'Verificando...' : 'Áudio' }}
  </button>
</ng-template>

<input #seletor type="file" [accept]="accept" (change)="aoSelecionar($event)" hidden />

<span class="erro" *ngIf="erro()" role="alert">{{ erro() }}</span>
